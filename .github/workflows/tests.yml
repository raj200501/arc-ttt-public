name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch + project)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]
      - name: Run offline test suite
        run: python -m pytest tests/ -q

  verify-headline-numbers:
    # Split out from the test job on purpose: both verify scripts are
    # stdlib-only, so this job cannot go red for reasons unrelated to the
    # numbers (no torch wheel, no pip index, no transformers pin). A badge
    # that fails for an unrelated reason is worse than no badge on a repo
    # whose whole claim is that the numbers hold up.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recompute the k=30 gate verdict from raw per-receipt records
        run: python3 scripts/verify_verdict.py
      - name: Recompute the Addendum E verdict under its frozen rule
        run: python3 scripts/addendum_e_summary.py
      - name: Re-derive the constrained-decoding counterfactual
        # The analysis that runs AGAINST our own claim. If it ever stops
        # reproducing, the badge should go red for that too.
        run: python3 scripts/format_counterfactual.py --out /tmp/cf.json
      - name: Re-derive the per-tenant verdicts (one tenant FAILS the rule)
        run: python3 scripts/per_tenant_verdicts.py --out /tmp/ptv.json
      - name: Recompute the Addendum D failure
        run: python3 scripts/read_addendum_d.py
      - name: Re-score stored predictions against regenerated gold
        run: python3 scripts/verify_from_primary.py experiments/novel_schema_f_0.5b_k30_seed1_docadapted_2026-08-19.json

  fencecheck-action:
    # The root action.yml, run through `uses:` the way a consumer runs it,
    # so a broken action goes red here before an outside team finds it.
    # A clean tree must pass, and a fail-open grader must fail the step.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: A clean tree passes
        uses: ./
        with:
          path: tools
      - name: Write a fail-open grader
        run: |
          mkdir -p "$RUNNER_TEMP/bait"
          printf 'import json\ndef grade(completion):\n    try:\n        return json.loads(completion)["a"]\n    except ValueError:\n        return 0.0\n' > "$RUNNER_TEMP/bait/grade.py"
      - name: A fail-open site fails the step
        id: bait
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/bait
      - name: Require that failure
        if: steps.bait.outcome != 'failure'
        run: |
          echo "the action passed a tree with a fail-open site"
          exit 1
