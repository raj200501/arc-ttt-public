[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcttt"
version = "0.0.1"
description = "Test-time training lab for ARC Prize 2026"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# tests import after pytest.importorskip; the flat kernel bundle style
# interleaves module sections with their imports by construction.
"tests/*" = ["E402"]
"kaggle/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
