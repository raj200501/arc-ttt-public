[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcttt"
version = "0.0.1"
description = "Per-tenant adaptation lab: small-model document extraction with preregistered evals (grew out of an ARC Prize 2026 entry)"
requires-python = ">=3.11"
license = {text = "MIT"}
# transformers upper bound: DynamicCache.crop's legacy positive-argument
# interpretation is scheduled for removal in 5.18 (decode._crop_cache already
# uses the negative non-deprecated form, but keep the tested range pinned).
dependencies = ["transformers>=4.54,<5.18"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1", "mypy>=1.13,<2"]
# The demo/adaptation paths need torch; kept out of core deps so the scoring
# and verify scripts stay installable anywhere (they are stdlib-only anyway).
# CPU wheels: pip install torch --index-url https://download.pytorch.org/whl/cpu
demo = ["torch>=2.4,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# tests import after pytest.importorskip; the flat kernel bundle style
# interleaves module sections with their imports by construction.
"tests/*" = ["E402"]
"kaggle/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
